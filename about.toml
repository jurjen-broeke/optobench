# cargo-about: the third-party licence notices shipped in every release archive
# (.github/workflows/release.yml). Keep `accepted` in step with deny.toml's
# [licenses] allow list and its exceptions.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # egui's default fonts, built into optobench-ui (deny.toml, epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
