# CI for optobench (docs/design.md, Tests and validation; docs/milestones/M0-foundations.md).
#
# While the repository is private, Actions minutes are billed (macOS counts 10x,
# Windows 2x). So Linux runs on every push, and macOS and Windows run on pull requests and
# manual runs only. Once the repository is public, add them to pushes as well.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt, clippy, xtask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check

  test-linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-other:
    # Static name: GitHub appends the matrix OS when the job runs, and a skipped run
    # (plain pushes) shows this name instead of an unexpanded expression.
    name: test macOS, Windows
    # Billed at a higher rate while private: pull requests and manual runs only.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo xtask check

  wasm:
    name: engine on wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The engine (L0-L4) has no file system or network access (AGENTS.md, Layers).
      - name: Build L0-L4 for wasm32-unknown-unknown
        run: >
          cargo build --target wasm32-unknown-unknown
          -p optobench-math
          -p optobench-surfaces -p optobench-materials
          -p optobench-trace
          -p optobench-scene -p optobench-library
          -p optobench-analysis -p optobench-optimize -p optobench-field

  deny:
    name: cargo-deny (licences, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
