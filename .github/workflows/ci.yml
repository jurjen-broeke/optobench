# CI for optobench (docs/design.md, Tests and validation; docs/milestones/M0-foundations.md).
# The repository is public, so Actions minutes are free: every push tests on Linux, macOS
# and Windows.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    name: fmt, clippy, xtask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo xtask check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The checks job runs xtask on Linux; this catches path and line-ending differences.
      - if: runner.os != 'Linux'
        run: cargo xtask check

  wasm:
    name: engine on wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The engine (L0-L4) has no file system or network access (AGENTS.md, Layers).
      - name: Build L0-L4 for wasm32-unknown-unknown
        run: >
          cargo build --target wasm32-unknown-unknown
          -p optobench-math
          -p optobench-surfaces -p optobench-materials
          -p optobench-trace
          -p optobench-scene -p optobench-library
          -p optobench-analysis -p optobench-optimize -p optobench-field
          -p optobench-gpu

  deny:
    name: cargo-deny (licences, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
