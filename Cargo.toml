[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jurjen-broeke/optobench"

[workspace.dependencies]
# Workspace crates, listed by layer. A crate may depend only on crates in its own or a lower layer;
# `cargo xtask check` enforces this.
optobench-math = { path = "crates/optobench-math" }               # L0
optobench-surfaces = { path = "crates/optobench-surfaces" }       # L1
optobench-materials = { path = "crates/optobench-materials" }     # L1
optobench-trace = { path = "crates/optobench-trace" }             # L2
optobench-scene = { path = "crates/optobench-scene" }             # L3
optobench-library = { path = "crates/optobench-library" }         # L3
optobench-analysis = { path = "crates/optobench-analysis" }       # L4
optobench-optimize = { path = "crates/optobench-optimize" }       # L4
optobench-field = { path = "crates/optobench-field" }             # L4
optobench-gpu = { path = "crates/optobench-gpu" }                 # L4
optobench-io = { path = "crates/optobench-io" }                   # L5
optobench-bridge = { path = "crates/optobench-bridge" }           # L5, SolidCraft's control channel (M12)
optobench-commands = { path = "crates/optobench-commands" }       # L5

# Third-party crates. Each must pass `cargo deny check` (deny.toml) and be compatible with
# MIT OR Apache-2.0. Keep this list short; engine crates (L0-L4) should need almost none.
# The user interface (apps/optobench-ui), as SolidCraft builds its own (design.md, Decided):
spade = { version = "2.15", default-features = false, features = ["std"] }  # MIT OR Apache-2.0; display tessellation
egui = "0.37"                                                     # MIT OR Apache-2.0
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }  # MIT OR Apache-2.0; default_fonts: OFL-1.1, Ubuntu-font-1.0 (allowed for fonts, deny.toml)
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }  # MIT OR Apache-2.0; exact float parsing, so saved results read back bit for bit
rustfft = "6.4"                                                   # MIT OR Apache-2.0; FFT for fields, behind optobench-field's `transform` (design.md, Field propagation)
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde", "display"] }  # MIT OR Apache-2.0 (display: toml_writer, MIT OR Apache-2.0)
wgpu = "30.0"                                                     # MIT OR Apache-2.0; GPU compute (optobench-gpu), as eframe already brings it
pollster = "1.0"                                                  # MIT OR Apache-2.0; waits for wgpu's futures on desktop
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }  # MIT OR Apache-2.0; format-preserving edits

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
float_cmp = "warn"

[profile.release]
debug = 1
